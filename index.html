<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="お菓子業界向けの商品管理・見積システム - メーカーと問屋をつなぐB2B取引プラットフォーム">
  <meta name="keywords" content="お菓子,商品管理,見積もり,B2B,メーカー,問屋">
  <title>お菓子業界 商品・見積管理システム</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon (optional) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>">
</head>
<body>
  <!-- Skip to main content for accessibility -->
  <a href="#main-content" class="skip-to-main">メインコンテンツへスキップ</a>

  <div class="app-container">
    <!-- Header -->
    <header id="app-header" class="hidden" role="banner">
      <div class="header-content">
        <div class="logo">🍬 お菓子管理システム</div>
        <nav class="nav-tabs" id="nav-tabs" role="navigation" aria-label="メインナビゲーション"></nav>
        <div class="user-info">
          <div class="user-badge" id="user-badge" role="status"></div>
          <button class="btn-logout" onclick="app.logout()" aria-label="ログアウト">ログアウト</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" role="main"></main>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toast-container" role="region" aria-live="polite" aria-atomic="true"></div>

  <!-- External JavaScript -->
  <script src="js/app.js"></script>
  <script>
    // Initialize the app when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => app.init());
    } else {
      app.init();
    }
  </script>
</body>
</html>
