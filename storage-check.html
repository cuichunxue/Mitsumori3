<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ストレージ容量チェック</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .info { background: #e3f2fd; padding: 15px; border-radius: 8px; margin: 10px 0; }
    .warning { background: #fff3cd; padding: 15px; border-radius: 8px; margin: 10px 0; }
    .danger { background: #f8d7da; padding: 15px; border-radius: 8px; margin: 10px 0; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; font-size: 14px; }
    .btn-danger { background: #dc3545; color: white; border: none; border-radius: 4px; }
    .btn-primary { background: #007bff; color: white; border: none; border-radius: 4px; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; max-height: 300px; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>🔍 LocalStorage容量チェック</h1>

  <div class="info">
    <h3>現在の使用状況</h3>
    <div id="usage"></div>
  </div>

  <div class="warning">
    <h3>⚠️ 問題の原因</h3>
    <p>「exceeded」エラーは、localStorageの容量制限（通常5-10MB）を超えたことを意味します。</p>
    <p>主な原因：<strong>商品画像をBase64形式で保存</strong>しているため、容量を大量に消費します。</p>
  </div>

  <h3>📊 データ詳細</h3>
  <div id="details"></div>

  <h3>🔧 対処方法</h3>
  <button class="btn-danger" onclick="clearAllData()">全データを削除（リセット）</button>
  <button class="btn-primary" onclick="clearImagesOnly()">画像のみ削除（商品情報は保持）</button>
  <button class="btn-primary" onclick="location.reload()">更新</button>

  <div id="result" style="margin-top: 20px;"></div>

  <script>
    function bytesToSize(bytes) {
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      if (bytes === 0) return '0 Byte';
      const i = parseInt(Math.floor(Math.log(bytes) / Math.log(1024)));
      return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
    }

    function checkStorage() {
      let total = 0;
      const details = [];

      for (let key in localStorage) {
        if (localStorage.hasOwnProperty(key)) {
          const size = (localStorage[key].length + key.length) * 2; // UTF-16
          total += size;

          let itemData = '';
          try {
            const parsed = JSON.parse(localStorage[key]);
            if (Array.isArray(parsed)) {
              itemData = `${parsed.length}件の配列`;
            } else if (typeof parsed === 'object') {
              itemData = `オブジェクト (${Object.keys(parsed).length}プロパティ)`;
            } else {
              itemData = String(parsed).substring(0, 50);
            }
          } catch (e) {
            itemData = String(localStorage[key]).substring(0, 50);
          }

          details.push({ key, size, data: itemData });
        }
      }

      details.sort((a, b) => b.size - a.size);

      // 使用状況表示
      const usagePercent = (total / (5 * 1024 * 1024) * 100).toFixed(1);
      let usageClass = 'info';
      if (usagePercent > 80) usageClass = 'danger';
      else if (usagePercent > 50) usageClass = 'warning';

      document.getElementById('usage').innerHTML = `
        <p><strong>合計使用量:</strong> ${bytesToSize(total)} / 約5MB</p>
        <p><strong>使用率:</strong> <span style="font-size: 24px; color: ${usagePercent > 80 ? 'red' : 'green'}">${usagePercent}%</span></p>
        <div style="background: #e0e0e0; height: 30px; border-radius: 15px; overflow: hidden;">
          <div style="background: ${usagePercent > 80 ? '#dc3545' : '#28a745'}; height: 100%; width: ${Math.min(usagePercent, 100)}%; transition: width 0.3s;"></div>
        </div>
      `;

      // 詳細表示
      let tableHTML = '<table><tr><th>キー</th><th>サイズ</th><th>内容</th></tr>';
      details.forEach(d => {
        tableHTML += `<tr><td>${d.key}</td><td>${bytesToSize(d.size)}</td><td>${d.data}</td></tr>`;
      });
      tableHTML += '</table>';

      document.getElementById('details').innerHTML = tableHTML;

      // 画像データの確認
      const products = JSON.parse(localStorage.getItem('products') || '[]');
      const productsWithImages = products.filter(p => p.imageBase64);

      if (productsWithImages.length > 0) {
        document.getElementById('details').innerHTML += `
          <div class="warning" style="margin-top: 15px;">
            <p><strong>⚠️ ${productsWithImages.length}件の商品に画像が含まれています</strong></p>
            <p>画像を削除すると容量を大幅に削減できます。</p>
          </div>
        `;
      }
    }

    function clearAllData() {
      if (confirm('本当に全データ（商品、見積、ユーザー情報）を削除しますか？\n\nこの操作は取り消せません。')) {
        localStorage.clear();
        document.getElementById('result').innerHTML = '<div class="info">✅ 全データを削除しました。ページをリロードしてください。</div>';
        setTimeout(() => location.reload(), 2000);
      }
    }

    function clearImagesOnly() {
      if (confirm('商品情報は保持したまま、画像データのみを削除しますか？')) {
        const products = JSON.parse(localStorage.getItem('products') || '[]');
        const productsWithoutImages = products.map(p => ({
          ...p,
          imageBase64: null,
          imageMime: null
        }));

        localStorage.setItem('products', JSON.stringify(productsWithoutImages));

        document.getElementById('result').innerHTML = '<div class="info">✅ 画像データを削除しました。容量が大幅に削減されました。</div>';
        setTimeout(() => location.reload(), 2000);
      }
    }

    // ページロード時に実行
    checkStorage();
  </script>
</body>
</html>
